# =====================================================================
# CoreBank — application.properties
# All secrets are pulled from environment variables. See .env.example.
# =====================================================================

spring.application.name=corebank

# --- Database -----------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:corebank_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ------------------------------------------------------
# Schema is managed by database/schema.sql, not Hibernate auto-DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT --------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please-override-in-env}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Server -------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# --- CORS (frontend runs as static files on a different port) -----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000,http://127.0.0.1:5500}

# --- OpenAPI ------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging --------------------------------------------------------------
logging.level.com.corebank=INFO
logging.level.org.springframework.security=WARN
