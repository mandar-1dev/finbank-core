<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Details — CoreBank</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-chrome="customer">
<header class="topbar">
  <div class="brand">Core<span class="dot">Bank</span></div>
  <div class="topbar-actions"><div class="topbar-customer" data-topbar-customer></div></div>
</header>
<div class="app-shell">
  <aside class="sidebar">
    <nav>
      <a href="dashboard.html" data-page="dashboard.html">🏠 Dashboard</a>
      <a href="accounts.html" data-page="accounts.html">💳 Accounts</a>
      <a href="transfer.html" data-page="transfer.html">↔ Transfer Money</a>
      <a href="transactions.html" data-page="transactions.html">📄 Transactions</a>
      <a href="beneficiaries.html" data-page="beneficiaries.html">👥 Beneficiaries</a>
      <a href="cards.html" data-page="cards.html">🪪 Cards</a>
      <a href="loans.html" data-page="loans.html">🏦 Loans</a>
      <a href="profile.html" data-page="profile.html">⚙ Profile</a>
      <div class="divider"></div>
      <a href="#" data-action="switch-customer">🔁 Switch Customer</a>
      <a href="#" data-action="back-home">← Back to Home</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="container">
      <div class="page-title"><div><h1 id="acctTitle">Account</h1><p id="acctSub" class="muted"></p></div></div>
      <div class="balance-hero" style="margin-bottom:24px;" id="acctHero">
        <div class="label">Available Balance</div>
        <div class="amount" id="acctBalance">—</div>
      </div>
      <h2 style="margin-bottom:14px;">Transaction History</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ref</th><th>Type</th><th>Description</th><th>Date</th><th style="text-align:right;">Amount</th></tr></thead>
          <tbody id="acctTxnBody"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/customer-context.js"></script>
<script src="js/navigation.js"></script>
<script>
async function loadAccountDetails() {
  requireSelectedCustomer();
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) { window.location.href = 'accounts.html'; return; }
  try {
    const [account, txns] = await Promise.all([
      api.get(`/accounts/${id}`),
      api.get(`/accounts/${id}/transactions`),
    ]);
    qs('#acctTitle').textContent = `${account.accountType} Account`;
    qs('#acctSub').textContent = account.maskedNumber + '  ·  ' + account.status;
    qs('#acctBalance').textContent = formatCurrency(account.availableBalance);

    const body = qs('#acctTxnBody');
    if (!txns || txns.length === 0) {
      body.innerHTML = `<tr><td colspan="5" class="muted">No transactions yet.</td></tr>`;
      return;
    }
    body.innerHTML = txns.map((t) => {
      const isCredit = String(t.destinationAccountId) === String(id);
      const cls = isCredit ? 'amount-in' : 'amount-out';
      const sign = isCredit ? '+' : '−';
      return `<tr>
        <td class="mono faint">${t.transactionRef}</td>
        <td><span class="badge badge-neutral">${t.type}</span></td>
        <td>${escapeHtml(t.description || '')}</td>
        <td class="muted">${formatDate(t.createdAt)}</td>
        <td style="text-align:right;" class="${cls}">${sign}${formatCurrency(t.amount)}</td>
      </tr>`;
    }).join('');
  } catch (err) {
    notify.error(err.message);
  }
}
document.addEventListener('DOMContentLoaded', loadAccountDetails);
</script>
</body>
</html>
