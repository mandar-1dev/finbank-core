<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loans — CoreBank</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-chrome="customer">
<header class="topbar">
  <div class="brand">Core<span class="dot">Bank</span></div>
  <div class="topbar-actions"><div class="topbar-customer" data-topbar-customer></div></div>
</header>
<div class="app-shell">
  <aside class="sidebar">
    <nav>
      <a href="dashboard.html" data-page="dashboard.html">🏠 Dashboard</a>
      <a href="accounts.html" data-page="accounts.html">💳 Accounts</a>
      <a href="transfer.html" data-page="transfer.html">↔ Transfer Money</a>
      <a href="transactions.html" data-page="transactions.html">📄 Transactions</a>
      <a href="beneficiaries.html" data-page="beneficiaries.html">👥 Beneficiaries</a>
      <a href="cards.html" data-page="cards.html">🪪 Cards</a>
      <a href="loans.html" data-page="loans.html">🏦 Loans</a>
      <a href="profile.html" data-page="profile.html">⚙ Profile</a>
      <div class="divider"></div>
      <a href="#" data-action="switch-customer">🔁 Switch Customer</a>
      <a href="#" data-action="back-home">← Back to Home</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="container">
      <div class="page-title"><div><h1>Loans</h1><p>Simulated loan calculator and application — not a real credit product.</p></div></div>

      <div class="grid" style="grid-template-columns: 1fr 1fr; gap:20px; align-items:start;">
        <div class="card">
          <h3>EMI Calculator</h3>
          <div class="field"><label>Loan Amount (₹)</label><input type="number" id="calcPrincipal" value="300000" min="1000"></div>
          <div class="field"><label>Interest Rate (% p.a.)</label><input type="number" id="calcRate" value="10.5" step="0.1"></div>
          <div class="field"><label>Tenure (months)</label><input type="number" id="calcTenure" value="24" min="1"></div>
          <button class="btn btn-secondary btn-block" id="calcBtn">Calculate</button>
          <div id="calcResult" style="margin-top:16px;"></div>
          <button class="btn btn-primary btn-block" id="applyBtn" style="margin-top:10px;">Apply for Simulated Loan</button>
        </div>

        <div>
          <h3 style="margin-bottom:10px;">Your Loans</h3>
          <div id="loansList"><div class="card skeleton" style="height:100px"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/notifications.js"></script>
<script src="js/customer-context.js"></script>
<script src="js/navigation.js"></script>
<script src="js/loans.js"></script>
</body>
</html>
